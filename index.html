<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>원의 성질 탐구 실험실</title><style>body{margin:0;background:#f5f8ff;font-family:'Malgun Gothic',sans-serif;color:#25344a}header{text-align:center;padding:20px;background:#dcefff}h1{margin:0;font-size:28px}header p{margin:8px 0 0}.wrap{max-width:1050px;margin:22px auto;padding:0 15px}.tabs{display:flex;gap:9px;flex-wrap:wrap}.tabs button{flex:1;min-width:190px}.tabs button.active{background:#2469c9;color:white}.panel{display:grid;grid-template-columns:minmax(300px,1.4fr) minmax(250px,1fr);gap:18px;margin-top:14px}.paper,.side{background:white;border-radius:18px;padding:18px;box-shadow:0 4px 16px #d9e3f4}canvas{width:100%;height:auto;touch-action:none;display:block;cursor:grab}.paper-top{display:flex;justify-content:flex-end;margin-bottom:8px}.paper.expanded{position:fixed;inset:0;z-index:1000;border-radius:0;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;overflow:auto;background:#fff;padding:12px 18px}.paper.expanded .paper-top{width:min(100%,1100px);flex-shrink:0}.paper.expanded canvas{width:auto;max-width:100%;height:auto;max-height:calc(100vh - 190px);aspect-ratio:620/530;object-fit:contain;flex:1;min-height:0}.paper.expanded .actions{width:min(100%,1100px);justify-content:center;flex-shrink:0}.paper.expanded .paper-top button{background:#2469c9;color:#fff}body.viewer-expanded{overflow:hidden}button{border:0;border-radius:12px;padding:12px 14px;background:#e9f0ff;color:#23436e;font-size:16px;font-weight:700;cursor:pointer}button:hover{filter:brightness(.96)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.side h2{margin:4px 0 10px;font-size:23px}.side p{line-height:1.65}.readout{background:#f0f6ff;padding:14px;border-radius:12px;margin:12px 0;line-height:1.9}.hint{background:#fff5d9;border-radius:12px;padding:13px;margin-top:15px;line-height:1.6}.question{font-weight:700;color:#174d9d}.toggle{display:flex;align-items:center;gap:7px;margin:10px 0}.toggle input{width:18px;height:18px}.footer{text-align:center;color:#64748b;margin:18px}input[type=range]{width:100%}@media(max-width:720px){.panel{grid-template-columns:1fr}h1{font-size:23px}}</style></head><body><header><h1>🔵 원의 성질 탐구 실험실</h1><p>직접 움직이고, 비교하고, 발견해 보세요!</p></header><main class="wrap"><div class="tabs"><button class="active" data-tab="0">미션 1 · 가장 긴 선분과 접기</button><button data-tab="1">미션 2 · 지름과 반지름</button><button data-tab="2">미션 3 · 무수히 많은 선분</button></div><div class="panel"><section class="paper" id="drawingPaper"><div class="paper-top"><button id="expandBtn" type="button" aria-pressed="false">⛶ 도형 전체화면</button></div><canvas id="cv" width="620" height="530" aria-label="드래그할 수 있는 원 탐구 화면"></canvas><div class="actions" id="actions"></div></section><section class="side"><h2 id="heading"></h2><p id="description"></p><div class="readout" id="readout" aria-live="polite"></div><div id="options"></div><div class="hint"><div class="question" id="question"></div><div id="tip"></div></div></section></div><p class="footer">교사용 안내: 원 위의 색깔 점을 마우스나 손가락으로 끌어 움직여 보세요. 길이는 화면상의 상대적인 단위입니다.</p></main><script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');const paper=document.getElementById('drawingPaper'),expandBtn=document.getElementById('expandBtn');function setExpanded(on){paper.classList.toggle('expanded',on);document.body.classList.toggle('viewer-expanded',on);expandBtn.textContent=on?'↙ 원래 화면으로':'⛶ 도형 전체화면';expandBtn.setAttribute('aria-pressed',String(on));}expandBtn.addEventListener('click',()=>setExpanded(!paper.classList.contains('expanded')));document.addEventListener('keydown',e=>{if(e.key==='Escape'&&paper.classList.contains('expanded'))setExpanded(false)});const C={x:310,y:258},R=185;let tab=0,angA=-2.55,angB=.45,diamAng=0.2,radiusAng=-1.25,fold=false,showDiameter=false,foldT=0,foldAnim=null,showRadii=true,lines=[],count=0,radiusMarks=[];const $=id=>document.getElementById(id);const p=a=>({x:C.x+R*Math.cos(a),y:C.y+R*Math.sin(a)});const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);const btn=(label,fn)=>{let b=document.createElement('button');b.textContent=label;b.onclick=fn;return b};function line(a,b,color,width=3,dash=[]){ctx.beginPath();ctx.setLineDash(dash);ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke();ctx.setLineDash([])}function dot(q,color,label){ctx.beginPath();ctx.arc(q.x,q.y,9,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();ctx.strokeStyle='white';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#26364e';ctx.font='bold 18px sans-serif';ctx.fillText(label,q.x+12,q.y-12)}function circle(){ctx.beginPath();ctx.arc(C.x,C.y,R,0,Math.PI*2);ctx.fillStyle='#eef7ff';ctx.fill();ctx.strokeStyle='#335b92';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#26364e';ctx.font='bold 16px sans-serif';ctx.fillText('ㅇ',C.x+11,C.y+20);ctx.beginPath();ctx.arc(C.x,C.y,5,0,Math.PI*2);ctx.fillStyle='#26364e';ctx.fill()}function text(s,x,y,color='#26364e',size=17){ctx.fillStyle=color;ctx.font=`bold ${size}px sans-serif`;ctx.fillText(s,x,y)}function foldFrame(t){
 // Fold the smaller circular segment across the student's actual chord AB.
 // Orthographic projection of a 180-degree paper fold: y -> cos(pi*t)*y.
 const A=p(angA),B=p(angB),dx=B.x-A.x,dy=B.y-A.y,L=Math.hypot(dx,dy);
 if(L<2)return;
 const ux=dx/L,uy=dy/L,nx=-uy,ny=ux;
 const signed=(C.x-A.x)*nx+(C.y-A.y)*ny;
 // Positive local y points away from the circle's center (the folded cap).
 const sign=signed>=0?-1:1;
 const vx=nx*sign,vy=ny*sign;
 const mid={x:(A.x+B.x)/2,y:(A.y+B.y)/2};
 const h=Math.abs(signed),half=L/2,co=Math.cos(Math.PI*t);
 ctx.save();ctx.translate(mid.x,mid.y);ctx.transform(ux,uy,vx,vy,0,0);
 // Show the unmoving part of the paper (the original circle's large segment).
 ctx.beginPath();ctx.arc(0,-h,R,0,2*Math.PI);ctx.clip();
 ctx.fillStyle='#b8ddfa';ctx.fillRect(-R-10,-R*2-10,R*2+20,R*2+10);
 ctx.restore();
 // Draw the rotating cap, clipped to the original circle and positive side
 // BEFORE projection. This works for any chord, not only a diameter.
 ctx.save();ctx.translate(mid.x,mid.y);ctx.transform(ux,uy,vx,vy,0,0);
 ctx.save();ctx.scale(1,co);
 ctx.beginPath();ctx.arc(0,-h,R,0,Math.PI*2);ctx.clip();
 ctx.beginPath();ctx.rect(-R-10,0,2*R+20,R*2+20);ctx.clip();
 ctx.fillStyle='rgba(255,177,85,.9)';ctx.fillRect(-R-10,0,2*R+20,R*2+20);
 ctx.strokeStyle='#d48130';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,-h,R,0,Math.PI*2);ctx.stroke();
 ctx.restore();
 ctx.beginPath();ctx.moveTo(-half,0);ctx.lineTo(half,0);ctx.strokeStyle='#1453b5';ctx.lineWidth=5;ctx.stroke();
 ctx.restore();
 // Outline the original circle so the mismatch remains visible at the end.
 ctx.beginPath();ctx.arc(C.x,C.y,R,0,Math.PI*2);ctx.strokeStyle='#335b92';ctx.lineWidth=2;ctx.setLineDash([6,5]);ctx.stroke();ctx.setLineDash([]);
 const isDiameter=h<2;
 let message=t<.5?'선분 ㄱㄴ를 따라 종이가 들리고 있어요':t<1?'반대편으로 내려오는 중이에요':isDiameter?'완전히 포개졌어요! 지름을 찾았네요!':'포개어지지 않아요! 지름이 아닌 선분이에요.';
 text(message,32,505,isDiameter?'#12669c':'#b45309',16);
}

function render(){ctx.clearRect(0,0,620,530);circle();if(tab===0){let a=p(angA),b=p(angB),d=p(diamAng),e=p(diamAng+Math.PI);line(a,b,'#e57a32',5);if(showDiameter)line(d,e,'#2265d0',4,[8,7]);dot(a,'#e57a32','ㄱ');dot(b,'#e57a32','ㄴ');text(showDiameter?'찾은 선분을 파란 지름과 비교해 보세요.':'두 점을 움직여 가장 긴 선분을 찾아보세요.',34,36,'#35547c',16);if(foldT>0)foldFrame(foldT);$('readout').innerHTML=`🟠 내가 만든 선분 ㄱㄴ: <b>${(dist(a,b)/R*5).toFixed(2)}</b>칸<br>${showDiameter?`🔵 비교할 지름: <b>10.00</b>칸<br>${dist(a,b)>R*1.995?'🎉 내가 찾은 선분은 지름만큼 길어요!':'파란 지름과 내가 만든 선분의 길이를 비교해 보세요.'}`:'어느 방향으로 점을 움직여야 더 길어질까요?<br>충분히 탐구한 다음 지름을 확인해 보세요.'}`}
if(tab===1){const a=p(diamAng),b=p(diamAng+Math.PI),r=p(radiusAng);line(a,b,'#2563eb',5);for(const angle of radiusMarks){line(C,p(angle),'#ffffff',8,[9,5]);line(C,p(angle),'#e87512',5,[9,5])}line(C,r,'#f0932b',6);dot(a,'#2563eb','ㄱ');dot(b,'#2563eb','ㄴ');dot(r,'#f0932b','ㄷ');text('파란 점: 지름 회전  |  주황 점: 반지름 회전',35,36,'#35547c',16);text('지름', (a.x+b.x)/2+12,(a.y+b.y)/2+35,'#2563eb',17);text('반지름',(C.x+r.x)/2+12,(C.y+r.y)/2-10,'#d97706',17);$('readout').innerHTML=`🟠 반지름 ㅇㄷ: <b>5.00</b>칸<br>🔵 지름 ㄱㄴ: <b>10.00</b>칸<br>지름 ÷ 반지름 = <b>2</b><br>지름 = 반지름 × <b>2</b><br>남긴 반지름 자국: <b>${radiusMarks.length}</b>개`}
if(tab===2){for(const a of lines){line(p(a),p(a+Math.PI),'#7e9ed4',1.8)}const a=p(diamAng),b=p(diamAng+Math.PI);line(a,b,'#236ad0',4);if(showRadii){line(C,a,'#f39b2f',5);line(C,b,'#f39b2f',5)}dot(a,'#236ad0','ㄱ');text('파란 점을 움직이거나 버튼을 눌러 보세요.',48,36,'#35547c',16);$('readout').innerHTML=`만든 지름: <b>${count+1}</b>개<br>그림에 표시한 반지름: <b>${showRadii?(count*2+2):'숨김'}</b>개<br>원에는 다른 방향의 지름과 반지름을 계속 만들 수 있어요.`}}
function setTab(t){tab=t;foldT=0;clearInterval(foldAnim);document.querySelectorAll('[data-tab]').forEach((b,i)=>b.classList.toggle('active',i===t));let a=$('actions'),o=$('options');a.innerHTML='';o.innerHTML='';if(t===0){$('heading').textContent='미션 1. 지름의 비밀';$('description').textContent='① 처음에는 원의 중심 O와 움직이는 두 점 A, B만 보입니다. 두 점을 움직여 가장 긴 선분을 스스로 찾아보세요. ② 만든 선분을 따라 먼저 접어 보고, 포개지지 않는다면 다시 점을 움직여 보세요. ③ 마지막에 ‘지름과 비교하기’를 눌러 확인하세요.';$('question').textContent='생각해 보기';$('tip').textContent='원의 중심 O를 지나는 선분이 가장 길까요? 먼저 예상하고 점을 움직여 실험해 보세요.';a.append(btn('🔍 지름과 비교하기',()=>{showDiameter=true;diamAng=angA;render()}),btn('▶ 접기 애니메이션',()=>{clearInterval(foldAnim);foldT=0.001;const slider=$('foldSlider');if(slider)slider.value=0;foldAnim=setInterval(()=>{foldT=Math.min(1,foldT+.0125);if(slider)slider.value=Math.round(foldT*100);render();if(foldT>=1)clearInterval(foldAnim)},35)}),btn('⏸ 일시정지',()=>clearInterval(foldAnim)),btn('↺ 다시 탐구하기',()=>{angA=-2.55;angB=.45;showDiameter=false;foldT=0;clearInterval(foldAnim);if($('foldSlider'))$('foldSlider').value=0;render()}));const foldLabel=document.createElement('label');foldLabel.style.display='block';foldLabel.style.marginTop='16px';foldLabel.textContent='🎞 접기 장면 직접 움직이기 (0~100%)';const foldSlider=document.createElement('input');foldSlider.type='range';foldSlider.id='foldSlider';foldSlider.min='0';foldSlider.max='100';foldSlider.value='0';foldSlider.setAttribute('aria-label','접기 애니메이션 프레임');foldSlider.oninput=()=>{clearInterval(foldAnim);foldT=Math.max(.001,Number(foldSlider.value)/100);render()};foldLabel.append(foldSlider);o.append(foldLabel);const note=document.createElement('p');note.style.fontSize='13px';note.textContent='내가 만든 주황색 선분 ㄱㄴ를 접는 축으로 사용합니다. 지름이 아니면 두 부분이 정확히 포개지지 않아요.';o.append(note);}else if(t===1){$('heading').textContent='미션 2. 두 길이의 관계';$('description').textContent='파란색 지름 ㄱㄴ와 주황색 반지름 ㅇㄷ을 서로 다른 선분으로 나타냈어요. 파란 점과 주황 점을 각각 움직여 방향을 바꾸고 길이를 비교해 보세요. ‘현재 반지름 자국 남기기’를 누르면 이전 반지름이 진한 주황색 점선으로 남습니다. 지름과 겹쳐도 자국이 위에 보입니다.';$('question').textContent='생각해 보기';$('tip').textContent='반지름을 두 개 이어 붙이면 무엇이 될까요? 지름의 길이는 반지름의 몇 배일까요?';a.append(btn('✏️ 현재 반지름 자국 남기기',()=>{radiusMarks.push(radiusAng);render()}),btn('🧹 반지름 자국 지우기',()=>{radiusMarks=[];render()}),btn('🔵 지름 돌리기',()=>{diamAng+=Math.PI/6;render()}),btn('🟠 반지름 돌리기',()=>{radiusAng+=Math.PI/6;render()}),btn('↺ 처음으로',()=>{diamAng=.2;radiusAng=-1.25;radiusMarks=[];render()}));}else{$('heading').textContent='미션 3. 끝없이 만들기';$('description').textContent='지름의 방향을 바꾸어 하나씩 남겨 보세요. 같은 원에서 서로 다른 지름과 반지름을 몇 개까지 만들 수 있을까요?';$('question').textContent='생각해 보기';$('tip').textContent='지름을 10개 만들었다면, 11번째도 만들 수 있을까요? 100번째는요?';a.append(btn('➕ 현재 지름 남기기',()=>{lines.push(diamAng);count++;diamAng+=Math.PI/17;render()}),btn('✨ 지름 20개 더 만들기',()=>{for(let i=0;i<20;i++){lines.push(diamAng);count++;diamAng+=Math.PI/21}render()}),btn('🧹 모두 지우기',()=>{lines=[];count=0;render()}));const l=document.createElement('label');l.className='toggle';const cb=document.createElement('input');cb.type='checkbox';cb.checked=showRadii;cb.onchange=()=>{showRadii=cb.checked;render()};l.append(cb,document.createTextNode('현재 지름의 반지름 두 개 강조'));o.append(l)}if(t<2)a.append(btn('다음 미션 →',()=>setTab(t+1)));if(t>0)a.append(btn('← 이전 미션',()=>setTab(t-1)));render()}
let dragging=null;function pos(e){let r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}}document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>setTab(Number(b.dataset.tab))));cv.addEventListener('pointerdown',e=>{let q=pos(e);if(tab===0){let da=dist(q,p(angA)),db=dist(q,p(angB));if(Math.min(da,db)<40)dragging=da<db?'a':'b'}else if(tab===1){let dr=dist(q,p(radiusAng)),da=dist(q,p(diamAng)),db=dist(q,p(diamAng+Math.PI));if(dr<28)dragging='radius';else if(Math.min(dr,da,db)<45)dragging=dr<=Math.min(da,db)+12?'radius':da<db?'d':'opp'}else if(dist(q,p(diamAng))<45||dist(q,p(diamAng+Math.PI))<45)dragging=dist(q,p(diamAng))<dist(q,p(diamAng+Math.PI))?'d':'opp';if(dragging)cv.setPointerCapture(e.pointerId)});cv.addEventListener('pointermove',e=>{if(!dragging)return;let q=pos(e),angle=Math.atan2(q.y-C.y,q.x-C.x);if(dragging==='a')angA=angle;else if(dragging==='b')angB=angle;else if(dragging==='radius')radiusAng=angle;else diamAng=angle+(dragging==='opp'?Math.PI:0);foldT=0;render()});cv.addEventListener('pointerup',()=>dragging=null);cv.addEventListener('pointercancel',()=>dragging=null);setTab(0);
</script></body></html>
